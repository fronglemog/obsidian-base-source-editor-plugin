# Packages to allow/deny script execution
allowBuilds:
  esbuild: true
  unrs-resolver: true

# Minimum age of package (minutes)
# Default: 1440 
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - 'obsidian'
  - '@obsidian-typings/*'
minimumReleaseAgeExcludePrune: true

# Override dependencies (including transitive dependencies)
overrides:
  '@lezer/lr': 1.4.10