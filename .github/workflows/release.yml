name: Release
on:
  push:
    # tags: ['*']
    # Only matches semver tags
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 12.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: cp build/main.js styles/styles.css .

      - uses: obsidianmd/obsidian-workflows@v1
        with:
          mode: release
          build: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}