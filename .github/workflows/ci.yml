name: CI
on:
  pull_request:
    branches: [main]

  workflow_dispatch: 

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 12.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - uses: obsidianmd/obsidian-workflows@v1
        with:
          mode: pr
          build: 'false'
